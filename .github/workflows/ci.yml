name: Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plate-pantry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_PLATE_PANTRY_BASE_PATH: /plate-pantry
      PLATE_PANTRY_PUBLIC_ORIGIN: https://jayro.dev
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install DMV backend dependencies
        run: npm ci --prefix backend --omit=dev
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify application
        run: npm run ci:test

  build-image:
    name: Build & Push Container Image
    needs: verify
    if: github.repository == 'jovalle/plate-pantry' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jovalle/plate-pantry:${{ github.sha }}
            ghcr.io/jovalle/plate-pantry:latest
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-origin:
    name: Deploy to Homelab Origin (nexus)
    needs: build-image
    if: github.repository == 'jovalle/plate-pantry'
    runs-on: [self-hosted, nexus]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Configure server overrides
        run: |
          if docker network inspect nexus_default >/dev/null 2>&1; then
            printf '%s\n' \
              'services:' \
              '  plate-pantry:' \
              '    networks:' \
              '      - nexus_default' \
              'networks:' \
              '  nexus_default:' \
              '    external: true' > compose.override.yaml
          fi
      - name: Deploy container via Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          PLATE_PANTRY_DATA_DIR: /mnt/data/docker/plate-pantry
          DMV_PROXY_REQUIRED: '1'
          DMV_PROXY_URL: http://gluetun:8888
          PLATE_PANTRY_SSR_ORIGIN: technis-nexus
          PLATE_PANTRY_PUBLIC_ORIGIN: https://jayro.dev
        run: |
          IMAGE_TAG=${{ github.sha }} docker compose pull
          IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans
      - name: Verify local origin health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://plate-pantry:5360/plate-pantry > /dev/null 2>&1 || \
               curl -fsS http://127.0.0.1:5360/plate-pantry > /dev/null 2>&1 || \
               docker compose exec -T plate-pantry node -e 'fetch("http://127.0.0.1:5360/plate-pantry").then(r => { if (!r.ok) process.exit(1); })' > /dev/null 2>&1; then
              echo "Local origin health check passed!"
              exit 0
            fi
            sleep 2
          done
          echo "Origin failed to become healthy within 60s"
          docker compose logs --tail 50
          exit 1

  deploy-edge:
    name: Publish jayro.dev/plate-pantry
    needs: deploy-origin
    if: github.repository == 'jovalle/plate-pantry'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install deployment dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify origin through tunnel
        run: npm run verify:production
        env:
          PLATE_PANTRY_VERIFY_URL: https://plate-pantry-origin.jayro.dev/plate-pantry
          PLATE_PANTRY_VERIFY_EDGE: '0'
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Publish the Cloudflare edge route
        run: npm run deploy:edge -- --env production --message "GitHub $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public site and redirect
        run: npm run verify:production
        env:
          EXPECTED_REVISION: ${{ github.sha }}
